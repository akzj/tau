<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tau</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.5 system-ui,sans-serif; background:#1a1a2e; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; }
#messages { flex:1; overflow-y:auto; padding:16px; }
#input-area { display:flex; padding:8px; border-top:1px solid #333; }
#input { flex:1; padding:10px; border:1px solid #444; border-radius:4px; background:#16213e; color:#e0e0e0; font:inherit; }
#send { padding:10px 20px; margin-left:8px; background:#0f3460; color:#e0e0e0; border:none; border-radius:4px; cursor:pointer; }
#send:hover { background:#1a4a8a; }
.msg { margin-bottom:8px; padding:6px 10px; border-radius:4px; max-width:85%; }
.msg.user { background:#0f3460; margin-left:auto; }
.msg.assistant { background:#16213e; }
.msg.tool { background:#1a3a1a; font-size:12px; color:#8f8; }
.msg.error { background:#3a1a1a; color:#f88; }
.streaming { opacity:0.7; }
</style>
</head><body>
<div id="messages"></div>
<div id="input-area">
  <input id="input" placeholder="Type a message..." autofocus>
  <button id="send">Send</button>
</div>
<script>
const ws = new WebSocket(`ws://${location.host}/ws`);
const msgs = document.getElementById('messages');
const input = document.getElementById('input');
const send = document.getElementById('send');

let currentMsg = null;
let toolMsgs = {};

ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  switch(m.type) {
    case 'message_start':
      currentMsg = addMsg('assistant', '', 'streaming');
      break;
    case 'message_delta':
      if (currentMsg) currentMsg.textContent += m.data;
      msgs.scrollTop = msgs.scrollHeight;
      break;
    case 'message_end':
      if (currentMsg) currentMsg.classList.remove('streaming');
      currentMsg = null;
      break;
    case 'tool_start':
      toolMsgs[m.call_id] = addMsg('tool', `[${m.name}] running...`);
      break;
    case 'tool_end':
      if (toolMsgs[m.call_id]) {
        toolMsgs[m.call_id].textContent = `[${m.name}] → ${m.content || 'done'}`;
      }
      break;
    case 'turn_end':
      break;
    case 'error':
      addMsg('error', m.data);
      break;
  }
};

ws.onclose = () => addMsg('error', 'Connection closed. Refresh to reconnect.');

function addMsg(role, text, cls) {
  const div = document.createElement('div');
  div.className = `msg ${role}` + (cls ? ` ${cls}` : '');
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

send.onclick = () => {
  const text = input.value.trim();
  if (!text) return;
  addMsg('user', text);
  ws.send(JSON.stringify({type: 'prompt', text: text}));
  input.value = '';
};
input.onkeydown = (e) => { if (e.key === 'Enter') send.click(); };
</script>
</body></html>
