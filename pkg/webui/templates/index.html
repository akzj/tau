<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tau — coding agent</title>
<style>
:root {
  --bg: #1a1a2e; --surface: #16213e; --border: #2a2a4a;
  --user: #4fc3f7; --assistant: #81c784; --tool: #a5d6a7; --tool-bg: #1a3a1a;
  --system: #90a4ae; --error: #ef5350; --error-bg: #3a1a1a; --accent: #0f3460;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.5 system-ui,sans-serif; background:var(--bg); color:#e0e0e0; height:100vh; display:flex; flex-direction:column; }

/* Header */
#header { display:flex; align-items:center; padding:8px 16px; border-bottom:1px solid var(--border); gap:12px; }
#header .logo { font-weight:bold; color:#fff; font-size:16px; }
#status { font-size:12px; color:var(--system); }
#status.streaming { color:var(--assistant); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* Messages */
#messages { flex:1; overflow-y:auto; padding:16px; }
.msg { margin-bottom:10px; padding:8px 12px; border-radius:6px; max-width:88%; word-break:break-word; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.msg.user { background:var(--accent); margin-left:auto; color:var(--user); }
.msg.assistant { background:var(--surface); color:var(--assistant); }
.msg.tool { background:var(--tool-bg); color:var(--tool); font-size:12px; cursor:pointer; }
.msg.tool .tool-header { display:flex; align-items:center; gap:6px; }
.msg.tool .tool-header .arrow { transition:transform .2s; display:inline-block; }
.msg.tool.open .tool-header .arrow { transform:rotate(90deg); }
.msg.tool .tool-result { display:none; margin-top:6px; padding:6px; background:rgba(0,0,0,.3); border-radius:4px; max-height:200px; overflow-y:auto; white-space:pre-wrap; font-family:monospace; font-size:11px; }
.msg.tool.open .tool-result { display:block; }
.msg.system { color:var(--system); font-style:italic; font-size:12px; }
.msg.error { background:var(--error-bg); color:var(--error); }
.msg.streaming { opacity:0.8; }
.streaming-cursor { color:var(--assistant); animation:pulse 1s infinite; }

/* Input */
#input-area { display:flex; padding:8px 16px; border-top:1px solid var(--border); gap:8px; }
#input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:#e0e0e0; font:inherit; outline:none; }
#input:focus { border-color:var(--accent); }
#send { padding:10px 20px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
#send:hover { background:#1a4a8a; }
#send:disabled { opacity:0.4; cursor:default; }

/* Session bar */
#session-bar { display:flex; gap:8px; align-items:center; }
#session-bar select { padding:4px 8px; background:var(--surface); color:#e0e0e0; border:1px solid var(--border); border-radius:4px; font:inherit; font-size:12px; }
#session-bar button { padding:4px 12px; background:var(--accent); color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:12px; }
</style>
</head><body>

<div id="header">
  <span class="logo">τ tau</span>
  <span id="status">idle</span>
  <div id="session-bar">
    <select id="session-list" onchange="loadSession(this.value)"><option value="">new session</option></select>
    <button onclick="newSession()">+ New</button>
  </div>
</div>

<div id="messages"></div>

<div id="input-area">
  <input id="input" placeholder="Type a message..." autofocus>
  <button id="send" onclick="sendMsg()">Send</button>
</div>

<script>
let ws = null;
let currentMsg = null;
let toolMsgs = {};
let sessionId = '';

function connect() {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = handleMsg;
  ws.onclose = () => { setStatus('disconnected'); addMsg('system', 'Disconnected. Reconnecting...'); setTimeout(connect, 2000); };
  ws.onopen = () => { setStatus('idle'); loadSessionList(); };
}

function handleMsg(e) {
  const m = JSON.parse(e.data);
  switch(m.type) {
    case 'message_start':
      currentMsg = addMsg('assistant', '', 'streaming');
      break;
    case 'message_delta':
      if (currentMsg) { currentMsg.textContent += m.data; }
      scrollDown();
      break;
    case 'message_end':
      if (currentMsg) { currentMsg.classList.remove('streaming'); currentMsg.querySelector('.streaming-cursor')?.remove(); }
      currentMsg = null;
      break;
    case 'tool_start':
      currentMsg = addMsg('tool', '', '');
      currentMsg.innerHTML = `<div class="tool-header"><span class="arrow">▶</span> 🔧 ${m.name}</div><div class="tool-result">running...</div>`;
      currentMsg.onclick = () => { currentMsg.classList.toggle('open'); };
      toolMsgs[m.call_id] = currentMsg;
      break;
    case 'tool_end':
      if (toolMsgs[m.call_id]) {
        const el = toolMsgs[m.call_id];
        const content = m.content || 'done';
        el.querySelector('.tool-result').textContent = content.length > 2000 ? content.slice(0,2000)+'...' : content;
        el.querySelector('.tool-header').innerHTML = `<span class="arrow">▶</span> 🔧 ${m.name} ✓`;
        el.classList.add('open');
      }
      break;
    case 'turn_end':
      setStatus('idle');
      break;
    case 'error':
      addMsg('error', m.data);
      break;
    case 'session':
      sessionId = m.data;
      break;
  }
}

function addMsg(role, text, cls) {
  const div = document.createElement('div');
  div.className = `msg ${role}` + (cls ? ` ${cls}` : '');
  if (role === 'assistant' && cls === 'streaming') {
    div.textContent = text;
    div.appendChild(Object.assign(document.createElement('span'), {className:'streaming-cursor', textContent:'▌'}));
  } else {
    div.textContent = text;
  }
  document.getElementById('messages').appendChild(div);
  scrollDown();
  return div;
}

function sendMsg() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  addMsg('user', text);
  ws.send(JSON.stringify({type:'prompt', text}));
  input.value = '';
  setStatus('streaming');
}

function setStatus(s) {
  const el = document.getElementById('status');
  el.textContent = s;
  el.className = s === 'streaming' ? 'streaming' : '';
}

function scrollDown() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function newSession() {
  if (ws) ws.send(JSON.stringify({type:'new_session'}));
  document.getElementById('messages').innerHTML = '';
  addMsg('system', 'New session started.');
}

function loadSession(id) {
  if (!id) return;
  if (ws) ws.send(JSON.stringify({type:'resume', text: id}));
  document.getElementById('messages').innerHTML = '';
  addMsg('system', `Loading session ${id}...`);
}

async function loadSessionList() {
  try {
    const res = await fetch('/sessions');
    const sessions = await res.json();
    const sel = document.getElementById('session-list');
    sel.innerHTML = '<option value="">new session</option>';
    for (const s of sessions) {
      const opt = document.createElement('option');
      opt.value = s.ID;
      opt.textContent = `${s.FirstMsg || s.ID} (${s.MsgCount} msgs)`;
      sel.appendChild(opt);
    }
  } catch(e) {}
}

document.getElementById('input').onkeydown = (e) => { if (e.key === 'Enter') sendMsg(); };
connect();
</script>
</body></html>
