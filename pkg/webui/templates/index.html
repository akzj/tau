<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tau — coding agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* === Theme — GitHub Dark === */
:root {
  --bg: #0d1117;
  --sidebar-bg: #161b22;
  --msg-system: #30363d;
  --msg-user: #1f6feb;
  --msg-assistant: #21262d;
  --msg-tool: #1a3a2a;
  --msg-error: #3a1a1a;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #1f6feb;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font:14px/1.6 system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }

/* === Header === */
#header { display:flex; align-items:center; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--sidebar-bg); gap:12px; min-height:44px; }
#header .logo { font-weight:700; color:#fff; font-size:16px; }
#status { font-size:11px; color:var(--text-dim); margin-left:auto; }
#status.streaming { color:#3fb950; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
#header button { padding:4px 10px; background:var(--msg-system); color:var(--text-dim); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-size:11px; }
#header button:hover { color:#fff; border-color:var(--text-dim); }

/* === Main: sidebar + messages === */
#main { display:flex; flex:1; overflow:hidden; }

/* === Sidebar === */
#sidebar { width:200px; min-width:200px; background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow-y:auto; }
#sidebar-title { padding:12px 12px 8px; font-size:10px; font-weight:700; text-transform:uppercase; color:var(--text-dim); letter-spacing:1px; }
#sidebar-list { flex:1; }
.sidebar-item { padding:6px 12px; font-size:12px; cursor:pointer; color:var(--text-dim); border-left:3px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-item:hover { color:var(--text); background:rgba(255,255,255,.03); }
.sidebar-item.active { color:#fff; border-left-color:var(--accent); background:rgba(31,111,235,.1); }
#sidebar-new { margin:8px; padding:6px 0; text-align:center; font-size:12px; color:var(--text-dim); background:var(--bg); border:1px dashed var(--border); border-radius:6px; cursor:pointer; }
#sidebar-new:hover { color:#fff; border-color:var(--text-dim); }

/* === Messages === */
#messages { flex:1; overflow-y:auto; padding:16px; }
.msg-wrap { margin-bottom:12px; animation:fadeIn .2s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.msg-bubble { padding:10px 14px; border-radius:8px; word-break:break-word; }
.msg-bubble p { margin:0; }
.msg-bubble p + p { margin-top:8px; }

/* System */
.msg-system { text-align:center; }
.msg-system .msg-bubble { display:inline-block; background:var(--msg-system); color:var(--text-dim); font-style:italic; font-size:12px; max-width:90%; padding:6px 14px; }

/* User */
.msg-user { display:flex; justify-content:flex-end; }
.msg-user .msg-bubble { background:var(--msg-user); color:#fff; max-width:70%; }

/* Assistant */
.msg-assistant .msg-bubble { background:var(--msg-assistant); color:var(--text); max-width:85%; }
.msg-assistant.streaming .msg-bubble { opacity:0.85; }
.streaming-cursor { color:#3fb950; animation:blink 0.5s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.reasoning { color: #ce93d8; font-style: italic; }
.cache     { color: #4dd0e1; }
.tool-ref  { color: #ffd54f; font-weight: bold; }

/* Tool */
.msg-tool .msg-bubble { background:var(--msg-tool); color:#7ee787; font-size:12px; cursor:pointer; }
.msg-tool .tool-header { display:flex; align-items:center; gap:6px; user-select:none; }
.msg-tool .tool-header .arrow { transition:transform .2s; display:inline-block; font-size:10px; }
.msg-tool.open .tool-header .arrow { transform:rotate(90deg); }
.msg-tool .tool-result { display:none; margin-top:8px; padding:8px; background:rgba(0,0,0,.35); border-radius:6px; max-height:300px; overflow-y:auto; white-space:pre-wrap; font-family:'SF Mono','Fira Code',monospace; font-size:11px; color:var(--text); }
.msg-tool.open .tool-result { display:block; }

/* Error */
.msg-error .msg-bubble { background:var(--msg-error); color:#f85149; }

/* Thinking */
.msg-thinking .msg-bubble { color:var(--text-dim); font-style:italic; font-size:12px; opacity:0.7; }

/* === Markdown inside bubbles === */
.msg-bubble pre { background:#0d1117; padding:12px; border-radius:6px; overflow-x:auto; margin:8px 0; }
.msg-bubble code { font-family:'SF Mono','Fira Code',monospace; font-size:13px; }
.msg-bubble pre code { background:none; padding:0; }
.msg-bubble :not(pre) > code { background:rgba(255,255,255,.07); padding:1px 5px; border-radius:4px; font-size:13px; }
.msg-bubble ul, .msg-bubble ol { margin:4px 0; padding-left:20px; }
.msg-bubble blockquote { border-left:3px solid var(--border); margin:6px 0; padding-left:10px; color:var(--text-dim); }

/* === File tree overlay === */
#file-tree-panel { position:fixed; right:0; top:44px; bottom:60px; width:240px; background:var(--sidebar-bg); border-left:1px solid var(--border); padding:12px; overflow-y:auto; font-size:12px; display:none; z-index:10; }
#file-tree-panel.visible { display:block; }
#file-tree-title { margin-bottom:8px; font-weight:700; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
.file-entry { padding:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.file-entry .icon { margin-right:4px; }
.file-entry.read { color:var(--text-dim); }
.file-entry.modified,.file-entry.edit { color:#e3b341; }
.file-entry.created,.file-entry.write { color:#3fb950; }
.file-entry.glob,.file-entry.grep { color:var(--text-dim); }

/* === Input === */
#input-area { display:flex; padding:8px 16px; border-top:1px solid var(--border); background:var(--sidebar-bg); gap:8px; align-items:flex-end; }
#input { flex:1; padding:10px 14px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; font:inherit; outline:none; resize:none; min-height:42px; max-height:120px; }
#input:focus { border-color:var(--accent); }
#send { padding:10px 20px; background:var(--accent); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-size:14px; white-space:nowrap; }
#send:hover { background:#1c58d9; }
#send:disabled { opacity:0.4; cursor:default; }

/* === Responsive === */
@media (max-width: 768px) {
  #sidebar { width:160px; min-width:160px; }
  #file-tree-panel { width:200px; }
  .msg-user .msg-bubble { max-width:85%; }
}
@media (max-width: 480px) {
  #sidebar { display:none; }
  #header { padding:6px 10px; }
  #file-tree-panel.visible { width:100%; top:44px; bottom:0; }
  #input { padding:10px 12px; font-size:16px; }
  #send { padding:12px 16px; min-height:44px; }
  #header button { min-height:44px; padding:8px 12px; }
  .msg-user .msg-bubble { max-width:90%; }
  .msg-assistant .msg-bubble { max-width:95%; }
}
</style>
</head><body>

<div id="header">
  <span class="logo">τ tau</span>
  <button id="file-tree-toggle" onclick="toggleFileTree()">📁 Files</button>
  <button onclick="newSession()">+ New</button>
  <select id="session-select" onchange="switchSession(this.value)" style="background:var(--msg-system);color:var(--text-dim);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:11px;max-width:160px;"><option value="">new session</option></select>
  <span id="status">idle</span>
</div>

<div id="main">
  <div id="sidebar">
    <div id="sidebar-title">Sessions</div>
    <div id="sidebar-list"></div>
    <div id="sidebar-new" onclick="newSession()">+ New Session</div>
  </div>
  <div id="messages"></div>
</div>

<div id="file-tree-panel">
  <div id="file-tree-title">Files</div>
  <div id="file-tree-content"></div>
</div>

<div id="input-area">
  <textarea id="input" placeholder="Type a message…" rows="1" autofocus></textarea>
  <button id="send" onclick="sendMsg()">Send</button>
</div>

<script>
let ws = null;
let currentBubble = null;       // DOM element of current streaming assistant bubble
let currentContent = '';        // raw text being accumulated
let toolBubbles = {};           // call_id → DOM element
let sessionId = '';
let fileTree = {};
let activeSessionId = null;

function connect() {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = handleMsg;
  ws.onclose = () => { setStatus('disconnected'); addMsg('system','Disconnected. Reconnecting…'); setTimeout(connect,2000); };
  ws.onopen = () => { setStatus('idle'); loadSessionList(); };
}

function handleMsg(e) {
  const m = JSON.parse(e.data);
  switch(m.type) {
    case 'message_start':
      currentBubble = addMsgBubble('assistant','','streaming');
      currentContent = '';
      break;
    case 'message_delta':
      currentContent += m.data;
      if (currentBubble) renderBubble(currentBubble, currentContent);
      smartScroll();
      break;
    case 'message_end':
      if (currentBubble) {
        currentBubble.classList.remove('streaming');
        currentBubble.querySelector('.streaming-cursor')?.remove();
        renderBubble(currentBubble, currentContent);
      }
      currentBubble = null;
      currentContent = '';
      disableSend(false);
      setStatus('idle');
      break;
    case 'tool_start':
      currentBubble = addMsgBubble('tool','','');
      currentBubble.querySelector('.msg-bubble').innerHTML =
        `<div class="tool-header"><span class="arrow">▶</span> 🔧 ${escHtml(m.name)}</div><div class="tool-result">running…</div>`;
      currentBubble.querySelector('.msg-bubble').onclick = () => currentBubble.classList.toggle('open');
      toolBubbles[m.call_id] = currentBubble;
      break;
    case 'tool_end':
      if (toolBubbles[m.call_id]) {
        const el = toolBubbles[m.call_id];
        const content = m.content || 'done';
        el.querySelector('.tool-result').textContent = content.length > 3000 ? content.slice(0,3000)+'…' : content;
        el.querySelector('.tool-header').innerHTML = `<span class="arrow">▶</span> 🔧 ${escHtml(m.name)} ✓`;
        el.classList.add('open');
      }
      if (m.file_path) updateFileTree(m.file_path, m.file_action||'modified');
      else if (m.content) {
        const match = m.content.match(/(?:Wrote \d+ bytes to|Replaced(?:.*?)in|Read) (\S+)/);
        if (match) updateFileTree(match[1], m.name==='read'?'read':m.name==='write'?'created':'modified');
      }
      break;
    case 'turn_end':
      setStatus('idle');
      disableSend(false);
      break;
    case 'thinking_delta':
      if (!window._thinkBuf) window._thinkBuf = '';
      window._thinkBuf += m.data;
      break;
    case 'thinking_end':
      if (window._thinkBuf) {
        addMsg('thinking','💭 '+window._thinkBuf);
        window._thinkBuf = '';
      }
      break;
    case 'error':
      addMsg('error', m.data);
      disableSend(false);
      setStatus('idle');
      break;
    case 'session':
      sessionId = m.data;
      break;
    case 'file_tree':
      if (m.data) { try { fileTree = JSON.parse(m.data); renderFileTree(); } catch(e){} }
      break;
  }
}

/* === Message rendering === */
function addMsg(role, text) { return addMsgBubble(role, text, ''); }

function addMsgBubble(role, text, cls) {
  const wrap = document.createElement('div');
  wrap.className = `msg-wrap msg-${role}` + (cls?` ${cls}`:'');
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  wrap.appendChild(bubble);
  renderBubble(bubble, text);
  if (role==='assistant' && cls==='streaming') {
    bubble.appendChild(Object.assign(document.createElement('span'),{className:'streaming-cursor',textContent:'▌'}));
  }
  document.getElementById('messages').appendChild(wrap);
  smartScroll();
  return wrap;
}

function renderBubble(bubble, text) {
  if (typeof marked !== 'undefined') {
    bubble.innerHTML = marked.parse(text);
  } else {
    bubble.innerHTML = escHtml(text)
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/`(.+?)`/g,'<code>$1</code>')
      .replace(/\n/g,'<br>');
  }
}

/* === Smart scroll === */
function smartScroll() {
  const m = document.getElementById('messages');
  const atBottom = m.scrollHeight - m.scrollTop - m.clientHeight < 60;
  if (atBottom) m.scrollTop = m.scrollHeight;
}

/* === Send === */
function sendMsg() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text || !ws || ws.readyState!==WebSocket.OPEN) return;
  addMsg('user', text);
  ws.send(JSON.stringify({type:'prompt', text}));
  input.value = '';
  input.style.height = 'auto';
  setStatus('streaming');
  disableSend(true);
}

function disableSend(v) { document.getElementById('send').disabled = v; }

function setStatus(s) {
  const el = document.getElementById('status');
  el.textContent = s;
  el.className = s==='streaming'?'streaming':'';
}

/* === Session management === */
function newSession() {
  if (ws) ws.send(JSON.stringify({type:'new_session'}));
  document.getElementById('messages').innerHTML = '';
  fileTree = {}; renderFileTree();
  addMsg('system','New session started.');
}

function loadSession(id) {
  if (!id) return;
  activeSessionId = id;
  if (ws) ws.send(JSON.stringify({type:'resume', text: id}));
  document.getElementById('messages').innerHTML = '';
  fileTree = {}; renderFileTree();
  addMsg('system',`Loading session ${id}…`);
  renderSidebar();
}

async function loadSessionList() {
  try {
    const res = await fetch('/sessions');
    const sessions = await res.json();
    window._sessions = sessions;
    renderSidebar();
  } catch(e) {}
}

function renderSidebar() {
  const list = document.getElementById('sidebar-list');
  const sessions = window._sessions || [];
  if (sessions.length===0) { list.innerHTML='<div class="sidebar-item">(no sessions)</div>'; return; }
  list.innerHTML = sessions.map(s =>
    `<div class="sidebar-item${s.ID===activeSessionId?' active':''}" onclick="loadSession('${escHtml(s.ID)}')">${escHtml(s.FirstMsg||s.ID)}</div>`
  ).join('');
}

/* === File tree === */
function toggleFileTree() { document.getElementById('file-tree-panel').classList.toggle('visible'); }

function updateFileTree(path, action) {
  if (!path) return;
  fileTree[path] = {action, time: new Date().toLocaleTimeString()};
  renderFileTree();
}

function renderFileTree() {
  const el = document.getElementById('file-tree-content');
  const paths = Object.keys(fileTree).sort();
  if (paths.length===0) { el.innerHTML='<div class="file-entry">No files yet</div>'; return; }
  el.innerHTML = paths.slice(-15).map(p => {
    const f = fileTree[p];
    const icon = f.action==='read'?'·':f.action==='write'?'●':'○';
    return `<div class="file-entry ${f.action}"><span class="icon">${icon}</span>${escHtml(p)}</div>`;
  }).join('');
}

/* === Helpers === */
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* === Input: Enter=send, Shift+Enter=newline, auto-resize === */
document.getElementById('input').addEventListener('keydown', function(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

/* === SSE Streaming consumer (EventSource) === */
function trySSE() {
  const prompt = document.getElementById('input').value.trim();
  if (!prompt) return;
  const evtSource = new EventSource('/api/stream?prompt=' + encodeURIComponent(prompt));
  let sseBubble = null;
  evtSource.onmessage = function(event) {
    const data = JSON.parse(event.data);
    if (data.type === 'delta') {
      if (!sseBubble) sseBubble = addMsgBubble('assistant', '', 'streaming');
      sseBubble.querySelector('.msg-bubble').innerHTML = marked ? marked.parse((sseBubble._raw||'') + data.content) : escHtml((sseBubble._raw||'') + data.content);
      sseBubble._raw = (sseBubble._raw || '') + data.content;
      smartScroll();
    } else if (data.type === 'done') {
      if (sseBubble) { sseBubble.classList.remove('streaming'); sseBubble.querySelector('.streaming-cursor')?.remove(); }
      evtSource.close();
      disableSend(false);
      setStatus('idle');
    } else if (data.type === 'error') {
      addMsg('error', data.message);
      evtSource.close();
      disableSend(false);
      setStatus('idle');
    }
  };
  evtSource.onerror = () => { evtSource.close(); disableSend(false); setStatus('idle'); };
}

connect();
</script>
</body></html>
